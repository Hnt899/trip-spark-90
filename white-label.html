<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Поиск автобусных билетов на TudaSuda" />
    <title>Поиск автобусов — TudaSuda</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #F5F5FA;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }

      /* Обёртка: центрирует контейнер и даёт ему отступы */
      .wl-wrapper {
        width: 100%;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 16px;
      }

      /* Сам контейнер модуля WL */
      .wl-container {
        width: 100%;
        max-width: 1200px;
        min-width: 360px;
        min-height: 400px;
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        overflow: hidden;
      }

      /* На десктопе — минимум 600px высоты */
      @media (min-width: 768px) {
        .wl-container {
          min-height: 600px;
        }
      }

      /* Мобильный вид — во весь экран */
      @media (max-width: 767px) {
        .wl-wrapper {
          padding: 0;
        }
        .wl-container {
          border-radius: 0;
          box-shadow: none;
          min-height: 100vh;
        }
      }
    </style>
  </head>
  <body>
    <div class="wl-wrapper">
      <div class="wl-container">
        <wl-embedded-portal partnerid="ippilipenko_wl"></wl-embedded-portal>
      </div>
    </div>

    <!-- Скрипт модуля White Label (tripandfly) -->
    <script type="module" src="https://tripandfly.ru/embedded-portal/embedded.js"></script>
  </body>
</html>
