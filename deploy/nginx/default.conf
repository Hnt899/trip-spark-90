# ===== Сжатие: главная причина медленной загрузки (JS 3.2 МБ отдавался несжатым) =====
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 6;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    image/svg+xml
    font/woff
    font/woff2;

# Редирект с HTTP на HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS для ts-trip.com
server {
    listen 443 ssl;
    http2 on;
    server_name ts-trip.com www.ts-trip.com;

    ssl_certificate /etc/letsencrypt/live/ts-trip.com-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ts-trip.com-0001/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # Лимит тела запроса: загрузка файлов в админке (multer до 200MB)
    client_max_body_size 210m;

    # index.html всегда отдаётся свежим (иначе браузер кеширует старый бандл)
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Картинки, видео, шрифты — кеш 30 дней
    location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf|mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # Хешированные ассеты Vite — долгий кеш
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ^~ /api {
        proxy_pass http://app:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /uploads {
        proxy_pass http://app:4000;
        proxy_set_header Host $host;
    }

    location ^~ /travelpayouts {
        proxy_pass http://app:4000/travelpayouts;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

